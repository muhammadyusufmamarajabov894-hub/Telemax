
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telemax AI Test</title>
</head>
<body>
  <h2>Telemax AI</h2>

  <input
    id="question"
    type="text"
    placeholder="Savolingizni yozing..."
  />
  <button id="send">Yuborish</button>

  <div id="answer">AI javobi shu yerda chiqadi.</div>

  <script type="module">
    // Firebase
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

    // Firebase App Check
    import {
      initializeAppCheck,
      ReCaptchaEnterpriseProvider
    } from
      "https://www.gstatic.com/firebasejs/13.4.0/firebase-app-check.js";

    // Firebase AI Logic
    import {
      getAI,
      getGenerativeModel,
      GoogleAIBackend
    } from
      "https://www.gstatic.com/firebasejs/13.4.0/firebase-ai.js";

    // Firebase konfiguratsiyasi
    const firebaseConfig = {
      apiKey: "AIzaSyBpUaZtGdBF43IgYy3BJL9TcD5zzoDCdqM",
      authDomain: "telemax-b6a9a.firebaseapp.com",
      databaseURL: "https://telemax-b6a9a-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "telemax-b6a9a",
      storageBucket: "telemax-b6a9a.firebasestorage.app",
      messagingSenderId: "746634996399",
      appId: "1:746634996399:web:c2959fc11f6760d4cb425a",
      measurementId: "G-K2DDBNPQBG"
    };

    // Firebase ishga tushirish
    const app = initializeApp(firebaseConfig);

    // App Check ishga tushirish
    const appCheck = initializeAppCheck(app, {
      provider: new ReCaptchaEnterpriseProvider(
        "6LeupTUuAAAAAJeL6nEKNlhiUAvDxfBUdvZHSVqs"
      ),
      isTokenAutoRefreshEnabled: true
    });

    // Gemini AI ulash
    const ai = getAI(app, {
      backend: new GoogleAIBackend()
    });

    const model = getGenerativeModel(ai, {
      model: "gemini-3.8-flash"
    });

    // Savol yuborish
    const sendButton = document.getElementById("send");
    const questionInput = document.getElementById("question");
    const answerBox = document.getElementById("answer");

    async function sendQuestion() {
      const question = questionInput.value.trim();

      if (!question) {
        answerBox.textContent = "Iltimos, savol yozing.";
        return;
      }

      sendButton.disabled = true;
      answerBox.textContent = "Telemax AI javob tayyorlamoqda...";

      try {
        const result = await model.generateContent(question);
        answerBox.textContent = result.response.text();
      } catch (error) {
        console.error("Telemax AI xatosi:", error);
        answerBox.textContent = "Xatolik: " + error.message;
      } finally {
        sendButton.disabled = false;
      }
    }

    sendButton.addEventListener("click", sendQuestion);

    questionInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        sendQuestion();
      }
    });
  </script>
</body>
</html>
